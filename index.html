        <button id="test" class="btn" type="button" onclick="change()">OFF</button>

        <script>
            let x = -1;
            function change() {
                x = x * -1;
                if (x == -1) {
                    document.getElementById("test").innerHTML = "OFF";
                    document.getElementById("test").style.backgroundColor = "#ff0000";
                    document.getElementById("test").style.color = "#00ff00";
                }
                else {
                    document.getElementById("test").innerHTML = "ON&nbsp";
                    document.getElementById("test").style.backgroundColor = "#00ff00";
                    document.getElementById("test").style.color = "#ff0000";
                }
            }
            function panic() {
                document.body.remove();
            }
        </script>
